<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDesk Escolar - Abrir Chamado</title>
    <link href="style.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <header class="topo">
        <div class="topo">
            <span class="topo conteudo">HelpDesk Escolar</span>
            <nav class="topo-nav">
                <a href="index.html" class="ativo">
                    Abrir Chamado
                </a>
                <a href="chamados.html">Ver chamado</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <div class="cartao">
            <h1>Abrir novo chamado</h1>
            <p class="subtitulo">Descreva o problema encontrado na escola. A equipe responsável vai analisar e atualizar os status</p>
            <form id="form-chamado" novalidate>
                <div class="campo">
                    <label for="setor">Nome do solicitante</label>
                    <input type="text" id="setor" name="setor" placeholder="Ex: sala 12, laborátorio 2, secretaria" required>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                     <select name="prioridade" id="prioridade" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="Descrição do produto"></label>
                    <textarea name="descricao" id="descricao" rows="4" placeholder="Explique com detalhes o que esta acontecendo" required></textarea>

                </div>
                <button type="submit" class="botao-principal">Registrar Chamado</button>
                <p id="mensagem-status" class="mensagem-status" role="status" aria-live="polite"></p>

            </form>
        </div>
    </main>
    
  </body>
</html>
