<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo"> <span class="topo-marca">HelpDesk Escolar</span>
        <nav class="topo-nav">
            <a href="index.html">Abrir chamado</a>
            <a href="chamados.html" class="ativo">Ver Chamado</a>
        </nav>
        </div>
    </header>
    <main class="conteudo conteudo-larga">
        <div class="cabeçalho-lista">
        <div>
            <h1> Chamados registrados</h1>
            <p class="subtitulo">Acompanhe, filtre e atualize o status dos chamados abertos pela escola</p>
        </div>
        <div class="campo campo-filtro">
            <label for="filtro-status">filtrar por status</label>
            <select id="filtro-status">
                <option value="Todos"></option>
                <option value="Aberto"></option>
                <option value="Em andamento"></option>
                <option value="Resolvido"></option>
            </select>
        </div>
        </div>

        <div id="lista-chamados" class="lista-chamados">
            <!--os cartoes de chamado sao inseridos aqui via javascript-->
        </div>
        <p id="mensagem-vazia" class="mensagem-vazia" hidden>
            <!--Return chamado encontrado para esse filtro-->
        </p>
    </main>
        <script src="Storage.js"></script>
        <script src="Chamados.js"></script>
   
</body>
</html>
